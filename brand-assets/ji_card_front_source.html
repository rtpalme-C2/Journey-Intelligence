<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;1,200;1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { width: 813px; height: 813px; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: #F5F2EC;
  width: 813px;
  height: 813px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.bg-paths {
  position: absolute;
  top: 0; left: 0;
  width: 813px;
  height: 813px;
  pointer-events: none;
}
.globe { position: relative; z-index: 1; margin-bottom: 32px; }
.divider {
  width: 360px;
  height: 1px;
  background: rgba(184,144,12,.22);
  margin-bottom: 32px;
  position: relative;
  z-index: 1;
}
.wordmark {
  position: relative;
  z-index: 1;
  font-size: 42px;
  line-height: 1;
  margin-bottom: 16px;
  letter-spacing: -0.02em;
}
.wordmark .journey { font-weight: 300; color: #1E1609; }
.wordmark .intel { font-weight: 200; font-style: italic; color: #6C500F; }
.tagline {
  position: relative;
  z-index: 1;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.26em;
  color: #8C6C2C;
  text-transform: uppercase;
}
</style>
</head>
<body>
<svg class="bg-paths" viewBox="0 0 813 813" xmlns="http://www.w3.org/2000/svg">
  <rect width="813" height="813" fill="#F5F2EC"/>
  <path d="M-20 600 C180 420 380 530 580 360 C700 270 800 320 870 290" stroke="rgba(184,144,12,.10)" stroke-width="2.2" fill="none"/>
  <path d="M-20 660 C160 480 360 590 560 420 C685 330 790 385 870 355" stroke="rgba(184,144,12,.06)" stroke-width="1.6" fill="none"/>
  <path d="M60 710 C260 525 460 635 660 465 C765 385 850 430 880 410" stroke="rgba(184,144,12,.04)" stroke-width="1.2" fill="none"/>
</svg>
<div class="globe">
  <svg width="210" height="210" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="90" stroke="#6C500F" stroke-width="2" opacity=".28"/>
    <ellipse cx="100" cy="100" rx="36" ry="90" stroke="#B8900C" stroke-width="4" opacity=".92"/>
    <line x1="10" y1="100" x2="190" y2="100" stroke="#B8900C" stroke-width="2.4" stroke-linecap="round" opacity=".58"/>
    <path d="M14 64 Q100 50 186 64" stroke="#6C500F" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".38"/>
    <path d="M14 136 Q100 150 186 136" stroke="#6C500F" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".38"/>
    <circle cx="100" cy="100" r="11" fill="#B8900C" opacity=".92"/>
    <circle cx="100" cy="100" r="4.5" fill="#1E1609"/>
  </svg>
</div>
<div class="divider"></div>
<div class="wordmark"><span class="journey">Journey </span><span class="intel">Intelligence</span></div>
<div class="tagline">Advisory · Curation · Insight</div>
</body>
</html>
